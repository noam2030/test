<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />
  <style>
    :root {
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #f5f5ff;
      --muted: rgba(245, 245, 255, 0.65);
      --accent-1: #ff6ec4;
      --accent-2: #7873f5;
      --accent-3: #4ade80;
    }
    [data-theme="light"] {
      --bg-1: #fdfbfb;
      --bg-2: #e0c3fc;
      --bg-3: #8ec5fc;
      --card: rgba(255, 255, 255, 0.55);
      --card-border: rgba(255, 255, 255, 0.9);
      --text: #1e1b4b;
      --muted: rgba(30, 27, 75, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-2));
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      overflow-x: hidden;
      min-height: 100vh;
      padding: 2rem 0 3rem;
      display: grid;
      place-items: center;
      transition: color 0.4s ease;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating blurred blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
    }
    .blob.one   { width: 380px; height: 380px; background: var(--accent-1); top: -80px; left: -80px; }
    .blob.two   { width: 320px; height: 320px; background: var(--accent-2); bottom: -60px; right: -60px; animation-delay: -5s; }
    .blob.three { width: 220px; height: 220px; background: var(--accent-3); top: 55%; left: 60%; animation-delay: -9s; opacity: 0.35; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 25px) scale(0.95); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 560px);
      padding: 3rem 2.5rem 2.5rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, background 0.4s ease;
      animation: popIn 0.9s cubic-bezier(0.18, 1.25, 0.4, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(30px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .wave {
      font-size: 4rem;
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30%      { transform: rotate(14deg); }
      20%           { transform: rotate(-8deg); }
      40%           { transform: rotate(-4deg); }
      50%           { transform: rotate(10deg); }
    }

    h1 {
      margin-top: 0.75rem;
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 300% center; } }

    .typed {
      margin-top: 1rem;
      min-height: 1.6em;
      font-size: 1.15rem;
      color: var(--muted);
    }
    .typed::after {
      content: "▍";
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .clock {
      margin-top: 2rem;
      font-variant-numeric: tabular-nums;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .date {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .actions {
      margin-top: 2.25rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      font-weight: 600;
      border: none;
      cursor: pointer;
      padding: 0.8rem 1.5rem;
      border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
    }
    button:hover  { transform: translateY(-2px); }
    button:active { transform: translateY(1px) scale(0.97); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 10px 25px rgba(120, 115, 245, 0.45);
    }
    .primary:hover { box-shadow: 0 14px 32px rgba(255, 110, 196, 0.55); }

    .ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--card-border);
    }
    .ghost:hover { background: rgba(255, 255, 255, 0.12); }

    .input-area {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
    }
    .input-area textarea {
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.8rem 1rem;
      min-height: 90px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-area textarea::placeholder { color: var(--muted); }
    .input-area textarea:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(120, 115, 245, 0.35);
    }
    .input-area button { align-self: center; }

    .counter {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    footer {
      position: fixed;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 1;
    }

    .confetti {
      position: fixed;
      top: 0;
      width: 10px;
      height: 14px;
      z-index: 5;
      pointer-events: none;
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="blob one" aria-hidden="true"></div>
  <div class="blob two" aria-hidden="true"></div>
  <div class="blob three" aria-hidden="true"></div>

  <main class="card" id="card">
    <span class="wave" id="wave" role="img" aria-label="Waving hand">👋</span>
    <h1>Hello World!</h1>
    <p class="typed" id="typed" aria-live="polite"></p>

    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>

    <div class="actions">
      <button class="primary" id="celebrate">🎉 Celebrate</button>
      <button class="ghost" id="theme" aria-label="Toggle theme">🌙 Theme</button>
    </div>
    <p class="counter" id="counter"></p>

    <div class="input-area">
      <label for="userInput" class="date">Write something:</label>
      <textarea id="userInput" placeholder="Type your text here..."></textarea>
      <button class="primary" id="helloBtn">Click me</button>
    </div>
  </main>

  <footer>Served from Cloud Run · built with ♥</footer>

  <script>
    // ---------- Theme toggle (persisted) ----------
    const root = document.documentElement;
    const themeBtn = document.getElementById("theme");
    const applyTheme = (t) => {
      root.setAttribute("data-theme", t);
      themeBtn.textContent = t === "light" ? "☀️ Theme" : "🌙 Theme";
      localStorage.setItem("theme", t);
    };
    applyTheme(localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
    themeBtn.addEventListener("click", () =>
      applyTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light"));

    // ---------- Typewriter ----------
    const phrases = [
      "Welcome to your shiny new app ✨",
      "Deployed on Google Cloud Run 🚀",
      "Click the hand. Or the button. 😉",
      "Have an awesome day!",
    ];
    const typedEl = document.getElementById("typed");
    let pi = 0, ci = 0, deleting = false;
    (function type() {
      const word = phrases[pi];
      typedEl.textContent = word.slice(0, ci);
      if (!deleting && ci < word.length) { ci++; setTimeout(type, 55); }
      else if (!deleting) { deleting = true; setTimeout(type, 1800); }
      else if (ci > 0) { ci--; setTimeout(type, 28); }
      else { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(type, 300); }
    })();

    // ---------- Live clock ----------
    const clockEl = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    function tick() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    }
    tick();
    setInterval(tick, 1000);

    // ---------- 3D tilt on the card ----------
    const card = document.getElementById("card");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduceMotion) {
      document.addEventListener("mousemove", (e) => {
        const x = (e.clientX / innerWidth - 0.5) * 2;
        const y = (e.clientY / innerHeight - 0.5) * 2;
        card.style.transform = `perspective(900px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
      });
      document.addEventListener("mouseleave", () => (card.style.transform = ""));
    }

    // ---------- Confetti ----------
    const colors = ["#ff6ec4", "#7873f5", "#4ade80", "#facc15", "#38bdf8", "#f97316"];
    function confetti(count = 120) {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = colors[(Math.random() * colors.length) | 0];
        el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(el);
        const drift = (Math.random() - 0.5) * 300;
        const spin = (Math.random() - 0.5) * 1440;
        el.animate(
          [
            { transform: `translate(0, -20px) rotate(0deg)`, opacity: 1 },
            { transform: `translate(${drift}px, 105vh) rotate(${spin}deg)`, opacity: 0.8 },
          ],
          { duration: 2200 + Math.random() * 1800, delay: Math.random() * 300, easing: "cubic-bezier(.25,.6,.4,1)" }
        ).onfinish = () => el.remove();
      }
    }

    const counterEl = document.getElementById("counter");
    let celebrations = Number(localStorage.getItem("celebrations") || 0);
    const renderCount = () => {
      counterEl.textContent = celebrations
        ? `You've celebrated ${celebrations} time${celebrations === 1 ? "" : "s"} 🎊`
        : "";
    };
    renderCount();
    function celebrate() {
      confetti();
      celebrations++;
      localStorage.setItem("celebrations", celebrations);
      renderCount();
    }
    document.getElementById("celebrate").addEventListener("click", celebrate);
    document.getElementById("wave").addEventListener("click", celebrate);

    // ---------- Text area + hello button ----------
    document.getElementById("helloBtn").addEventListener("click", () => {
      alert("hello!");
    });

    // ---------- Particle network background ----------
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const mouse = { x: -9999, y: -9999 };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(90, Math.floor((innerWidth * innerHeight) / 16000));
      particles = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.8 + 0.6,
      }));
    }
    addEventListener("resize", resize);
    addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    resize();

    function draw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const light = root.getAttribute("data-theme") === "light";
      const rgb = light ? "60, 50, 140" : "255, 255, 255";
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > innerWidth) p.vx *= -1;
        if (p.y < 0 || p.y > innerHeight) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${rgb}, 0.7)`;
        ctx.fill();
      }
      for (let i = 0; i < particles.length; i++) {
        const a = particles[i];
        for (let j = i + 1; j < particles.length; j++) {
          const b = particles[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 120) {
            ctx.strokeStyle = `rgba(${rgb}, ${0.18 * (1 - d / 120)})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (dm < 160) {
          ctx.strokeStyle = `rgba(${rgb}, ${0.35 * (1 - dm / 160)})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }
      if (!reduceMotion) requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
